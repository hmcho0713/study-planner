<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3학년 1반 플래너</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">우리반 플래너</div>
    <a href="index.html" class="active">🏠 메인</a>
    <!--<a href="community.html">💬 소통</a>-->
    <a href="planner.html">📝 플래너</a>
    <a href="timer.html">⏱️ 타이머</a>
    <a href="study.html">📚 공부공유</a>
    <span class="nav-logout" onclick="logout()">로그아웃</span>
  </nav>
  <div class="app">
    <div class="header">
      <h1>우리반 학습 플래너</h1>
      <span id="today-date"></span>
    </div>
    <div class="suneung-card">
      <div class="suneung-label">대학수학능력시험</div>
      <div class="suneung-dday" id="suneung-dday"></div>
      <div class="suneung-date">2026년 11월 19일</div>
    </div>
    <div class="section">
      <div class="section-title">시험 일정</div>
      <div id="dday-list"></div>
    </div>
    <div class="section">
      <div class="section-title">수행평가</div>
      <div id="performance-list"><div class="loading">불러오는 중...</div></div>
      <div class="add-row">
        <input id="perf-subject" placeholder="과목 (예: 국어)" />
        <input id="perf-date" type="date" style="width:140px;flex:none" />
        <input id="perf-detail" placeholder="세부 정보" />
        <button onclick="addPerformance()">+ 추가</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    function renderSuneung() {
      const today = new Date(); today.setHours(0,0,0,0)
      const target = new Date('2026-11-19')
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24))
      document.getElementById('suneung-dday').textContent = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day' : `D+${Math.abs(diff)}`
    }

    function renderDdays() {
      const today = new Date(); today.setHours(0,0,0,0)
      document.getElementById('dday-list').innerHTML = DDAYS.map(d => {
        const target = new Date(d.date)
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24))
        const label = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day' : `D+${Math.abs(diff)}`
        return `<div class="dday-row"><div><div class="dday-row-name">${d.name}</div><div class="dday-row-date">${d.date}</div></div><span class="dday-row-count">${label}</span></div>`
      }).join('')
    }

    function renderPerformances() {
      const list = document.getElementById('performance-list')
      if (!data.performances || data.performances.length === 0) { list.innerHTML = '<div class="loading">수행평가가 없어요!</div>'; return }
      list.innerHTML = data.performances.map((p, i) => `
        <div class="perf-item">
          <div><span class="perf-subject">${p.subject}</span><div class="perf-detail">${p.detail}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="perf-date">${p.date}</div>
            <button class="delete-btn" onclick="deletePerformance(${i})">×</button>
          </div>
        </div>
      `).join('')
    }

    async function addPerformance() {
      if (!requireLogin()) return
      const subject = document.getElementById('perf-subject').value.trim()
      const date = document.getElementById('perf-date').value
      const detail = document.getElementById('perf-detail').value.trim()
      if (!subject || !date) return
      data.performances.push({ subject, date, detail })
      renderPerformances(); save()
      document.getElementById('perf-subject').value = ''
      document.getElementById('perf-date').value = ''
      document.getElementById('perf-detail').value = ''
    }

    async function deletePerformance(i) {
      data.performances.splice(i, 1)
      renderPerformances(); save()
    }

    async function load() {
      document.getElementById('performance-list').innerHTML = `<div class="task"><div class="task-info"><div class="skeleton long"></div><div class="skeleton short"></div></div></div>`
      const res = await fetch(BASE_URL + '/latest', { headers: HEADERS })
      const json = await res.json()
      data = json.record
      renderPerformances()
    }

    async function onLoginSuccess() { await load() }

    document.getElementById('perf-detail').addEventListener('keydown', e => e.key === 'Enter' && addPerformance())
    document.getElementById('today-date').textContent = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })

    renderSuneung()
    renderDdays()
    if (requireLogin()) load()
  </script>
</body>
</html>
